name: Release Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run verification
        run: npm run verify

      - name: Build Windows installer
        run: npm run build && npx electron-builder --win nsis --x64 --publish never

      - name: Upload and publish the current package version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $installer = "E-Reader-Setup-$version.exe"
          gh release upload $tag "release/$installer#$installer" --clobber
          gh release edit $tag --draft=false --latest
